name: PickEatGo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Tests backend Django ────────────────────────────────────────────────
  backend:
    name: Tests Django
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pickeatgo_test
          POSTGRES_USER: pickeatgo
          POSTGRES_PASSWORD: pickeatgo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://pickeatgo:pickeatgo@localhost:5432/pickeatgo_test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Tests (mode plateforme)
        run: pytest -q
      - name: Tests (mode mono-restaurant, édition Marque Blanche)
        run: pytest -q -p no:cacheprovider --no-cov --create-db
        env:
          PICKEATGO_TEST_MODE: single
      - name: Vérifications de démarrage en mode single (sans puis avec instance amorcée)
        run: |
          APP_MODE=single python manage.py check
          APP_MODE=single python manage.py bootstrap_tenant --name "CI Resto" --email ci@example.com --password "CiSecret1234" > bootstrap.log
          cat bootstrap.log
          TENANT_RESTAURANT_ID=$(grep -o 'TENANT_RESTAURANT_ID=.*' bootstrap.log | cut -d= -f2)
          APP_MODE=single TENANT_RESTAURANT_ID=$TENANT_RESTAURANT_ID python manage.py check

  # ─── Build frontend Next.js ──────────────────────────────────────────────
  frontend:
    name: Build Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Déploiement : Render (backend) et Vercel (frontend) déploient automatiquement
  # depuis GitHub à chaque push sur main — aucun job nécessaire ici.
