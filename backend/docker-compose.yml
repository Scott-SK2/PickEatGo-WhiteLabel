version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# Docker Compose — développement local uniquement
# Le déploiement prod passe par Render (voir DEPLOY_RENDER.md)
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       pickeatgo_db
      POSTGRES_USER:     pickeatgo
      POSTGRES_PASSWORD: pickeatgo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickeatgo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  # ─── Django backend ─────────────────────────────────────────────────────────
  # Utilise l'image Python officielle — plus besoin de Dockerfile
  # pip install se fait à chaque démarrage (le cache pip accélère les redémarrages)
  backend:
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip   # cache des téléchargements pip
    command: >
      sh -c "pip install -r requirements.txt -q &&
             python manage.py migrate &&
             python manage.py collectstatic --no-input &&
             uvicorn pickeatgo.asgi:application --host 0.0.0.0 --port 8000 --reload --log-level info"
    environment:
      DATABASE_URL: postgresql://pickeatgo:pickeatgo@db:5432/pickeatgo_db
      REDIS_URL:    redis://redis:6379
      DEBUG:        "True"
      ENV:          development
      SECRET_KEY:   ${SECRET_KEY:-dev-secret-change-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY:    ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports: ["8000:8000"]
    depends_on:
      db:    {condition: service_healthy}
      redis: {condition: service_healthy}

  # ─── Frontend Next.js ────────────────────────────────────────────────────────
  frontend:
    build: ../frontend
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL:  ws://localhost:8000/ws
    depends_on: [backend]

volumes:
  postgres_data:
  pip_cache:
